# oMLX venvstacks layer template
#
# Layer structure + runtime pin + uv resolver settings live here. The
# actual `requirements = [...]` for the mlx-base layer is generated
# at build time by packaging/build.py:_generate_venvstacks_toml() from
# pyproject.toml's [project] dependencies + [bundle] optional extra, so
# this file does not list package versions. Single source of truth for
# Python deps is pyproject.toml.
#
# No [[applications]] block: the Swift app is the application surface,
# so the venvstacks export only ships a runtime + framework layer.

[[runtimes]]
name = "cpython-3.11"
python_implementation = "cpython@3.11.10"
requirements = []
platforms = [
    "macosx_arm64",
]

[[frameworks]]
name = "mlx-base"
runtime = "cpython-3.11"
# Populated by _generate_venvstacks_toml() — do not hand-edit.
requirements = [
    "mlx==0.32.4",
    "mlx-lm @ git+https://github.com/ml-explore/mlx-lm@0d4d3d04f8ab7ce4a51e7209e8615755a48ba94d",
    "regex",
    "mlx-embeddings @ git+https://github.com/Blaizzy/mlx-embeddings@32981fa4e8064ed664b52071789dd18271fe4206",
    "transformers>=5.14.0,<5.22",
    "mistral-common[audio]>=1.10",
    "tokenizers>=0.19.0",
    "huggingface-hub>=1.19.0",
    "numpy>=1.24.0,<2.4",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "itsdangerous>=2.0",
    "jinja2>=3.0",
    "rich>=13.0.0",
    "sentencepiece",
    "tiktoken",
    "protobuf",
    "requests>=2.28.0",
    "httpx>=0.27.0,<1",
    "socksio>=1.0.0",
    "ddgs==9.16.1",
    "tabulate>=0.9.0",
    "psutil>=5.9.0",
    "setproctitle>=1.3.3",
    "fastapi>=0.108.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.5",
    "jsonschema>=4.0.0",
    "openai-harmony",
    "cohere_melody>=0.9.0",
    "mlx-vlm @ git+https://github.com/Neywa-Labs/mlx-vlm@138d7617d39653b39a5cbc379b1b5907a4481d67",
    "mlx-audio @ git+https://github.com/Neywa-Labs/mlx-audio@8c244a1faff44cfa69e3151c195f52a4c1c90be5",
    "Pillow>=9.0.0",
    "markitdown[pdf,docx,pptx]==0.1.9",
    "mcp>=2.0.0,<3",
    "modelscope>=1.28.0",
    "scipy>=1.11.0",
    "librosa>=0.10.0",
    "miniaudio>=1.59",
    "numba>=0.59.0",
    "pyloudnorm>=0.1.0",
    "sounddevice>=0.4.6",
    "misaki>=0.9.4",
    "num2words>=0.5.14",
    "spacy>=3.8.4",
    "phonemizer-fork>=3.3.2",
    "espeakng-loader>=0.2.4",
    "webrtcvad>=2.0.10",
    "zstandard>=0.23.0",
    "wsproto==1.2.0",
]
platforms = [
    "macosx_arm64",
]
# Exclude cv2's duplicate dylibs (same libs already provided by Pillow/PIL)
dynlib_exclude = [
    "cv2/.dylibs/libavif*",
    "cv2/.dylibs/liblcms2*",
    "cv2/.dylibs/libpng16*",
    "cv2/.dylibs/libtiff*",
    "cv2/.dylibs/libfreetype*",
    "cv2/.dylibs/libharfbuzz*",
    "cv2/.dylibs/liblzma*",
    "cv2/.dylibs/libxcb*",
    "cv2/.dylibs/libXau*",
]

[tool.uv]
exclude-newer = "2026-04-23T00:00:00Z"
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
